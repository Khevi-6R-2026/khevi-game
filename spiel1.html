<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Music Around the World</title>

<style>
    body{
        margin:0;
        font-family:Arial, sans-serif;
        background:#1e1e2f;
        color:white;
        text-align:center;
    }

    h1{
        margin-top:20px;
        font-size:40px;
    }

    p{
        font-size:18px;
    }

    #game{
        margin-top:20px;
    }

    #map{
        position:relative;
        display:inline-block;
    }

    #worldMap{
        width:1000px;
        max-width:95%;
        border-radius:15px;
        border:4px solid white;
    }

    .country{
        position:absolute;
        width:30px;
        height:30px;
        border-radius:50%;
        cursor:pointer;
        border:2px solid white;
        transition:0.2s;
    }

    .country:hover{
        transform:scale(1.2);
    }

    #score{
        font-size:28px;
        margin-top:20px;
    }

    #message{
        font-size:30px;
        margin-top:15px;
        height:40px;
    }

    button{
        margin-top:20px;
        padding:15px 30px;
        font-size:20px;
        border:none;
        border-radius:10px;
        cursor:pointer;
        background:#ff9800;
        color:white;
    }

    button:hover{
        background:#ffb74d;
    }

</style>
</head>

<body>

<h1>🌍 Music Around the World 🎵</h1>
<p>Höre die Musik und klicke auf das richtige Land!</p>

<div id="score">Punkte: 0</div>

<button onclick="playMusic()">🎵 Musik abspielen</button>

<div id="message"></div>

<div id="game">
    <div id="map">

        <!-- Weltkarte -->
        <img id="worldMap" src="https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg">

        <!-- Länderpunkte -->

        <!-- Brasilien -->
        <div class="country"
             style="top:65%; left:32%; background:green;"
             onclick="checkAnswer('Brasilien')"></div>

        <!-- Spanien -->
        <div class="country"
     style="top:41%; left:44%; background:red;"
     onclick="checkAnswer('Spanien')"
     title="Spanien"></div>

        <!-- Japan -->
        <div class="country"
             style="top:40%; left:84%; background:white;"
             onclick="checkAnswer('Japan')"></div>

        <!-- USA -->
        <div class="country"
             style="top:38%; left:18%; background:blue;"
             onclick="checkAnswer('USA')"></div>

        <!-- Indien -->
        <div class="country"
             style="top:50%; left:70%; background:orange;"
             onclick="checkAnswer('Indien')"></div>

    </div>
</div>

<script>

let score = 0;

const songs = [
    {
        country: "Brasilien",
        music: "sounds/samba-latine.mp3"
    },
    {
        country: "Spanien",
        music: "sounds/flamenco.mp3"
    },
    {
        country: "Indien",
        music: "sounds/india.mp3"
    },
    {
        country: "USA",
        music: "sounds/usa.mp3"
    },
    {
        country: "Japan",
        music: "sounds/japan.mp3"
    }
];

let currentSong;
let audio = new Audio();

function playMusic(){

    currentSong = songs[Math.floor(Math.random() * songs.length)];

    audio.pause();
    audio = new Audio(currentSong.music);
    audio.play();

    document.getElementById("message").innerHTML = "🎶 Musik läuft...";
}

function checkAnswer(country){

    if(!currentSong){
        document.getElementById("message").innerHTML = "❗ Erst Musik starten!";
        return;
    }

    if(country === currentSong.country){

        score += 10;

        document.getElementById("message").innerHTML =
            "✅ Richtig! Das war " + currentSong.country + "!";

    } else {

        score -= 5;

        document.getElementById("message").innerHTML =
            "❌ Falsch! Gesucht war " + currentSong.country;

    }

    document.getElementById("score").innerHTML =
        "Punkte: " + score;

    audio.pause();
}

</script>

</body>
</html>
