<!DOCTYPE html>
<html lang="de">
<head>
  {% include head.html %}
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/game-style.css">
</head>
<body>
  {% include nav.html %}
  
  <div class="game-container">
    <section class="game-header">
      <h1>{{ page.title }}</h1>
      <p class="game-description">{{ page.description }}</p>
    </section>

    <section class="game-board">
      <canvas id="gameCanvas" width="800" height="600"></canvas>
    </section>

    <section class="game-controls">
      <button id="startBtn" class="btn btn-primary">Spiel starten</button>
      <button id="resetBtn" class="btn btn-secondary">Zurücksetzen</button>
      <button id="pauseBtn" class="btn btn-secondary">Pausieren</button>
    </section>

    <section class="game-stats">
      <div class="stat">
        <span class="stat-label">Punktzahl:</span>
        <span id="score" class="stat-value">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Level:</span>
        <span id="level" class="stat-value">1</span>
      </div>
    </section>

    {{ content }}
  </div>

  {% include footer.html %}

  <script>
    // Basis-Struktur für das Spiel mit Config-Support
    class Game {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.score = 0;
        this.level = 1;
        this.isRunning = false;
        this.isPaused = false;
        
        // Quiz-spezifische Properties
        this.isQuiz = false;
        this.questions = [];
        this.currentQuestionIndex = 0;
        this.currentQuestion = null;
        this.answered = false;
        
        this.init();
      }

      init() {
        this.attachEventListeners();
        // Initialisiere Quiz wenn gameConfig existiert
        if (window.gameConfig && window.gameConfig.type === 'quiz') {
          this.initializeQuiz(window.gameConfig);
        }
        this.draw();
      }

      // ===== Quiz-Unterstützung =====
      initializeQuiz(config) {
        this.isQuiz = true;
        this.questions = config.questions || [];
        this.currentQuestionIndex = 0;
        this.currentQuestion = null;
        this.answered = false;
        
        // Kennzeichne Container als Quiz-Spiel
        document.querySelector('.game-container').classList.add('is-quiz');
        
        // Setup Quiz-spezifische Event-Listener
        const buttons = document.querySelectorAll('.answer-btn');
        buttons.forEach(btn => {
          btn.addEventListener('click', (e) => {
            if (!this.answered && this.isRunning) {
              this.checkAnswer(parseInt(e.target.dataset.index));
            }
          });
        });
      }

      startQuiz() {
        this.score = 0;
        this.level = 1;
        this.currentQuestionIndex = 0;
        this.isRunning = true;
        this.loadQuestion();
        this.updateUI();
      }

      loadQuestion() {
        if (this.currentQuestionIndex >= this.questions.length) {
          this.endQuiz();
          return;
        }

        this.answered = false;
        this.currentQuestion = this.questions[this.currentQuestionIndex];
        this.displayQuestion();
        this.clearFeedback();
      }

      displayQuestion() {
        const img = document.getElementById('cityImage');
        if (this.currentQuestion.image) {
          img.src = this.currentQuestion.image;
          img.alt = this.currentQuestion.question || '';
        }

        // Zeige Lizenzinformation wenn vorhanden
        if (this.currentQuestion.credit) {
          const credit = this.currentQuestion.credit;
          document.getElementById('credit-title').textContent = credit.title;
          document.getElementById('credit-source').href = credit.source;
          document.getElementById('credit-source').textContent = credit.sourceText;
          document.getElementById('credit-license').textContent = credit.license;
        }

        const buttons = document.querySelectorAll('.answer-btn');
        buttons.forEach((btn, index) => {
          btn.textContent = this.currentQuestion.answers[index];
          btn.dataset.answer = this.currentQuestion.answers[index];
          btn.classList.remove('correct', 'incorrect');
          btn.disabled = false;
        });
      }

      checkAnswer(buttonIndex) {
        this.answered = true;
        const selectedAnswer = this.currentQuestion.answers[buttonIndex];
        const correctAnswer = this.currentQuestion.correct;
        const buttons = document.querySelectorAll('.answer-btn');

        if (selectedAnswer === correctAnswer) {
          this.score += 10;
          buttons[buttonIndex].classList.add('correct');
          this.showFeedback('✓ Richtig!', true);
        } else {
          buttons[buttonIndex].classList.add('incorrect');
          this.showFeedback('✗ Falsch! Richtig: ' + correctAnswer, false);
          // Zeige die richtige Antwort
          buttons.forEach((btn) => {
            if (btn.dataset.answer === correctAnswer) {
              btn.classList.add('correct');
            }
          });
        }

        this.updateUI();
        setTimeout(() => this.nextQuestion(), 2000);
      }

      nextQuestion() {
        this.currentQuestionIndex++;
        this.loadQuestion();
      }

      endQuiz() {
        this.isRunning = false;
        this.showFeedback('Spiel vorbei! Dein Score: ' + this.score, true);
        const buttons = document.querySelectorAll('.answer-btn');
        buttons.forEach(btn => btn.disabled = true);
      }

      showFeedback(message, isCorrect) {
        const feedback = document.getElementById('feedback');
        if (feedback) {
          feedback.textContent = message;
          feedback.className = 'feedback ' + (isCorrect ? 'feedback-correct' : 'feedback-incorrect');
          feedback.style.display = 'block';
        }
      }

      clearFeedback() {
        const feedback = document.getElementById('feedback');
        if (feedback) {
          feedback.style.display = 'none';
        }
      }

      // ===== Standard Game-Methoden =====
      attachEventListeners() {
        document.getElementById('startBtn').addEventListener('click', () => {
          if (this.isQuiz) {
            this.startQuiz();
          } else {
            this.start();
          }
        });
        document.getElementById('resetBtn').addEventListener('click', () => this.reset());
        document.getElementById('pauseBtn').addEventListener('click', () => this.togglePause());
      }

      start() {
        this.isRunning = true;
        this.gameLoop();
      }

      reset() {
        this.score = 0;
        this.level = 1;
        this.isRunning = false;
        this.isPaused = false;
        this.updateUI();
        this.draw();
      }

      togglePause() {
        this.isPaused = !this.isPaused;
      }

      gameLoop() {
        if (!this.isRunning) return;
        if (!this.isPaused) {
          this.update();
        }
        this.draw();
        requestAnimationFrame(() => this.gameLoop());
      }

      update() {
        // Spiel-Logik hier implementieren
      }

      draw() {
        // Canvas zeichnen
        if (this.isQuiz) return; // Quiz nutzt kein Canvas
        
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.ctx.fillStyle = '#f5f5f5';
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        
        if (this.isPaused) {
          this.ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
          this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
          this.ctx.fillStyle = 'white';
          this.ctx.font = 'bold 40px Arial';
          this.ctx.textAlign = 'center';
          this.ctx.fillText('PAUSIERT', this.canvas.width / 2, this.canvas.height / 2);
        }
      }

      updateUI() {
        document.getElementById('score').textContent = this.score;
        document.getElementById('level').textContent = this.level;
      }
    }

    // Spiel beim Laden der Seite initialisieren
    document.addEventListener('DOMContentLoaded', () => {
      const game = new Game();
    });
  </script>
</body>
</html>
